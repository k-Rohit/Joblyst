name: Joblyst-CI

on:
    push:
        branches: [main]
    pull_request:
jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10.3.0
              with:
                version: "0.10.2"
                enable-cache: true

            - name: Install dependencies
              run: uv sync --frozen --no-group ui
            
            - name: Lint
              run: uv run ruff check src tests scripts

            - name: Tests
              run: uv run pytest -q

    frontend:

        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
        - uses: actions/checkout@v7

        - uses: actions/setup-node@v7
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: frontend/package-lock.json

        - name: Install dependencies
          run: npm ci

        - name: Build
          run: npm run build

    docker:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7

        - name: Build image
          run: docker build -t joblyst-api .
