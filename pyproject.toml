[project]
name = "joblyst"
version = "0.1.0"
description = "A job-matching agent, built by following jamwithai/observable-job-agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "langgraph>=1.1",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "opik>=2.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joblyst"]
