# Hand-verified expected Profile fields for the fixture CVs.
#
# Drafted directly from the fixture CV text itself (these CVs were written
# for this project, so this is transcription, not a guessed extraction) —
# still marked verified: false until a human reads each field against the
# real PDF and flips it to true. An entry only enters the eval dataset once
# verified: true. Fields mirror joblyst.schemas.schemas.Profile; only the
# fields ProfileFieldAccuracy actually scores are listed here (seniority,
# years_experience, primary_roles, skills). locations and remote_ok are no
# longer extracted at all — they are candidate preferences, collected from the
# user, so a CV has no right answer to grade against.
# `name` is kept for readability only — it isn't scored.
#
# `projects` is listed too but NOT currently scored by any metric (it's free
# text with no clean scoring function). It's here because it's a known trap:
# 3 of 5 CVs have no Projects section at all, and the extraction prompt says
# to leave `projects` empty in that case — but the model doesn't reliably
# do that (see docs/engineering_log.md, "Profile extraction ignores its own
# leave empty instruction"). Expected `projects: []` on those three is the
# regression check for that exact bug once it's fixed.
#
# Ambiguous calls are flagged inline with a comment — check those first.

- cv_file: junior_ds_in.pdf
  verified: true
  expected:
    name: Ananya Rao
    seniority: mid
    primary_roles:
      - data scientist
    skills:
      - python
      - sql
      - pandas
      - numpy
      - scikit-learn
      - statsmodels
      - tableau
      - looker
      - git
      - jupyter
      - airflow
      - dbt
      - a/b testing
      - experimental design
      - regression analysis
    years_experience: 2.0
    # Has a real PROJECTS section — these should come through.
    projects:
      - "Transit Delay Predictor: trained a gradient boosting model on two years of public transit data to predict bus arrival delays, deployed as a small Flask API."
      - "Grocery Price Tracker: built a scheduled Python scraper and Streamlit dashboard tracking price changes across 200 supermarket items."

- cv_file: senior_mle_in.pdf
  verified: true
  expected:
    name: Arjun Mehta
    seniority: senior
    primary_roles:
      - senior machine learning engineer
      - machine learning engineer
      - data scientist
    skills:
      - python
      - go
      - sql
      - scala
      - pytorch
      - tensorflow
      - scikit-learn
      - xgboost
      - hugging face transformers
      - mlflow
      - weights and biases
      - kubeflow
      - feast
      - onnx
      - kubernetes
      - docker
      - aws
      - terraform
      - airflow
      - kafka
      - redis
    # The summary states "8 years" explicitly; note this sits right on the
    # senior/lead boundary (5-8 -> senior, 8+ -> lead) in the extraction
    # prompt's own anchors, so it's worth checking which way the model reads it.
    years_experience: 8.0
    # No Projects section anywhere in this CV -> this is the regression check.
    projects: []

- cv_file: career_changer_in.pdf
  verified: true
  expected:
    name: Priya Nair
    seniority: junior
    primary_roles:
      - data analyst
      - business analyst
      - analyst
    skills:
      - python
      - sql
      - excel
      - power bi
      - pandas
      - matplotlib
      - google sheets
      - jupyter
    # AMBIGUOUS ON PURPOSE (same trap the reference repo's own career-changer
    # label hit): 11 years teaching, ~0 years in data. "years_experience"
    # doesn't have one honest number for a career changer. Decide what the
    # extractor SHOULD report before scoring it against either number.
    years_experience: null
    # This CV is deliberately projects-heavy (career-changer pivot evidence).
    projects:
      - "Student Performance Dashboard: built a Power BI dashboard tracking results for 600 students across 4 academic years, adopted by the school leadership team."
      - "Attendance Predictor: trained a logistic regression model in Python that flags students at risk of dropping out, identifying 23 at-risk students in its first term."
      - "Timetable Optimiser: wrote a Python script using constraint solving to generate the school timetable, replacing a manual process that took two staff a full week."
      - "Exam Question Analysis: analysed 8 years of exam papers with pandas to find which topics were most frequently examined."

- cv_file: lead_in_remote.pdf
  verified: true
  expected:
    name: Kavya Iyer
    seniority: lead
    primary_roles:
      - lead data engineer
      - senior data engineer
      - data engineer
      - principal data engineer
      - technical lead data engineer
    skills:
      - python
      - scala
      - spark
      - kafka
      - snowflake
      - dbt
      - airflow
      - aws
      - terraform
      - kubernetes
      - flink
      - databricks
      - great expectations
      - postgresql
    years_experience: 11.0
    # Contact line explicitly says "Open to remote only" — this one isn't
    # ambiguous like Ananya's; a false here would be a real extraction miss.
    # No Projects section (has LEADERSHIP AND COMMUNITY instead) -> regression check.
    projects: []

- cv_file: mid_analyst_in.pdf
  verified: true
  expected:
    name: Ryan Patel
    seniority: mid
    primary_roles:
      - data analyst
      - business analyst
      - senior analyst
    skills:
      - sql
      - excel
      - looker
      - python
      - dbt
      - snowflake
      - tableau
      - google analytics
      - data modelling
      - stakeholder reporting
    # Only CV here with no "X years of experience" line — the number has to be
    # computed from date ranges. Business Analyst (2021-2022) plus Data Analyst
    # (2022-present) is 5 years of professional analyst work as of 2026; the
    # Analytics Intern year is excluded, same as primary_roles excludes it.
    years_experience: 5.0
    # No Projects section (has ACHIEVEMENTS instead) -> regression check.
    projects: []
